name: tests-and-wheel
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,assets,llm]"
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip uninstall -y news2douyin
      - name: Install wheel and check resources without the checkout on sys.path
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python -I tools/smoke_installed.py
