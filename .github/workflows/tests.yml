name: tests-and-wheel
on: [push, pull_request]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,assets,llm,video,voice-offline]"
      - name: Enable real FalkorDB integration on Linux Python 3.12
        if: runner.os == 'Linux' && matrix.python == '3.12'
        run: python -m pip install falkordblite==0.11.0
      - run: python -m pytest -q
      - run: python -m build
      - run: python -m pip uninstall -y news2douyin
      - name: Install wheel and check resources without the checkout on sys.path
        shell: bash
        run: |
          python -m pip install --no-deps dist/*.whl
          python -I tools/smoke_installed.py
          python -I tools/smoke_intelligence_installed.py
          python -I tools/smoke_newsnow_installed.py
          python -I tools/smoke_stability_installed.py
          python -I tools/smoke_event_content_installed.py

  postgres-locales:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        locale: [C, en_US.utf8]
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: n2dqa
          POSTGRES_PASSWORD: qa-only
          POSTGRES_DB: n2dqa
          POSTGRES_INITDB_ARGS: --locale=${{ matrix.locale }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U n2dqa -d n2dqa"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NEWS2DOUYIN_TEST_POSTGRES_URL: postgresql+psycopg://n2dqa:qa-only@127.0.0.1:5432/n2dqa
      NEWS2DOUYIN_TEST_POSTGRES_LOCALE: ${{ matrix.locale }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]" falkordblite==0.11.0
      - name: Check actual locale, queues, topic batches and checkpoint migration
        run: >-
          python -m pytest -q
          tests/test_graph_queue.py tests/test_graph_focus_postgres.py
          tests/test_graph_focus_migration.py tests/test_graph_gc_pause_migration.py
          tests/test_graph_migration_state.py tests/test_postgres_integration.py
          tests/test_postgres_migration.py tests/test_postgres_pipeline.py
          tests/test_postgres_search_triggers.py tests/test_startup.py
          tests/test_official_events.py tests/test_selection_backend.py
          tests/test_gdelt_pipeline_integration.py tests/test_event_metadata_handoff.py
          tests/test_intake_storage_v2.py
          tests/test_selection_counts_overview.py tests/test_reading_translations.py
          tests/test_focus_lifecycle.py tests/test_ui0270_journey.py
          tests/test_newsnow_integration.py tests/test_newsnow_handoff.py
          tests/test_attention_journey.py tests/test_attention_matching.py
          tests/test_attention_graph.py
          tests/test_attention_grouping.py tests/test_attention_runtime_review.py
          tests/test_attention_graph_postgres.py
          tests/test_attention_freshness.py
          tests/test_attention_freshness_postgres.py
          tests/test_text_index_safety.py tests/test_projection_isolation.py
          tests/test_intake_fetch_diagnostics.py tests/test_intake_status_ui.py
          tests/test_stability0291_journey.py tests/test_intake_sample_window.py
          tests/test_source_content_runtime.py tests/test_source_preview_translation.py
          tests/test_event_report_cards.py tests/test_event_content_journey.py
          tests/test_event_report_ui.py tests/test_event_source_query_budget.py
          tests/test_event_report_candidate_plan.py
