jobs:
  - name: us_premarket
    enabled: true
    timezone: America/New_York
    cron_expr: "50 8 * * 1-5"
    profile_name: us_market_macro
    auto_editorial: false
    auto_video: false
    auto_tts: false

  - name: cn_evening_review
    enabled: true
    timezone: Asia/Shanghai
    cron_expr: "10 19 * * 1-5"
    profile_name: cn_policy_sectors
    auto_editorial: false
    auto_video: false
    auto_tts: false
