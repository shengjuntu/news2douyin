[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news2douyin"
version = "0.4.0"
description = "Daily news collection -> scoring -> storyline -> Douyin script export"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "sqlmodel>=0.0.16,<0.1",
  "jinja2>=3.1.2,<4",
  "python-multipart>=0.0.9,<1",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0.1,<7",
  "requests>=2.31,<3",
  "worldnewsapi>=1.0,<3",
  "loguru>=0.7,<1",
  "mistune>=3.0,<4",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
video = ["Pillow>=10,<13"]
voice-offline = ["espeakng-loader>=0.2.4,<0.3"]
desktop = ["PyQt6>=6.6,<7"]
tts = ["edge-tts>=6.1.10,<8", "pyttsx3>=2.90,<3"]
llm = ["openai>=1,<3", "toml>=0.10,<1", "httpx[socks]>=0.27,<1"]
assets = ["beautifulsoup4>=4.12,<5", "lxml>=5.2,<7", "tqdm>=4.66,<5", "python-dateutil>=2.9,<3"]
dev = ["pytest>=7,<10", "httpx>=0.27,<1", "build>=1,<2"]

[project.scripts]
news2douyin = "news2douyin.cli:main"
news2douyin-server = "news2douyin.server.__main__:main"
news2douyin-gui = "news2douyin.gui.app:main"
news2douyin-simple-gui = "news2douyin.gui.simple_app:main"
news2douyin-platform = "news2douyin.platform.__main__:main"
news2douyin-v7-gui = "news2douyin.gui.v7_client_app:main"
news2douyin-repair-events = "news2douyin.storage.repair:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["news2douyin*"]

[tool.setuptools.package-data]
news2douyin = ["server/templates/*.html", "platform/templates/*.html", "prompts/en/*.txt", "prompts/zh/*.txt", "export/templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
