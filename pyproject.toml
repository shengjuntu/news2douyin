[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news2douyin"
version = "0.1.0"
description = "Daily news collection -> scoring -> storyline -> Douyin script export"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "sqlmodel>=0.0.16",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",

  "python-dotenv>=1.0.0",
  "PyYAML>=6.0.1",
  "Jinja2>=3.1.2",
  "requests>=2.31.0",
  "worldnewsapi>=1.0.0",
  "loguru>=0.7.0",
  "mistune>=3.0.0",
  "PyQt6>=6.6.0",
  "edge-tts>=6.1.10",
  "pyttsx3>=2.90",
]

[project.scripts]
news2douyin = "news2douyin.cli:main"
news2douyin-server = "news2douyin.server.__main__:main"
news2douyin-gui = "news2douyin.gui.app:main"
news2douyin-simple-gui = "news2douyin.gui.simple_app:main"
news2douyin-platform = "news2douyin.platform.__main__:main"
news2douyin-v7-gui = "news2douyin.gui.v7_client_app:main"
