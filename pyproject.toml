[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "news2douyin"
version = "0.58.0"
description = "Event intelligence, persistent knowledge tracking and evidence-based content workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.27,<1",
  "sqlmodel>=0.0.16,<0.1",
  "jinja2>=3.1.2,<4",
  "python-multipart>=0.0.9,<1",
  "tomli>=2,<3; python_version < '3.11'",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0.1,<7",
  "requests>=2.31,<3",
  "redis>=5,<8",
  "duckdb>=1.4,<1.5",
  "psycopg[binary]>=3.2,<4",
  "worldnewsapi>=1.0,<3",
  "loguru>=0.7,<1",
  "mistune>=3.0,<4",
  "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
ngrams = ["gdeltnews==1.1.0"]
graph = ["redis>=5,<8"]
research = ["pypdf>=5,<7", "Pillow>=10,<13"]
video = ["Pillow>=10,<13"]
voice-offline = ["espeakng-loader>=0.2.4,<0.3"]
tts = ["edge-tts>=6.1.10,<8", "pyttsx3>=2.90,<3"]
llm = ["openai>=1,<3", "toml>=0.10,<1", "httpx[socks]>=0.27,<1"]
assets = ["beautifulsoup4>=4.12,<5", "lxml>=5.2,<7", "tqdm>=4.66,<5", "python-dateutil>=2.9,<3"]
dev = ["pytest>=7,<10", "httpx>=0.27,<1", "build>=1,<2"]

[project.scripts]
news2douyin-review = "news2douyin.digest.review_cli:main"
news2douyin-daily-radar = "news2douyin.digest.cli:main"
news2douyin = "news2douyin.cli:main"
news2douyin-server = "news2douyin.server.__main__:main"
news2douyin-repair-events = "news2douyin.storage.repair:main"
news2douyin-migrate-sqlite = "news2douyin.storage.migrate:main"
news2douyin-db-query-index = "news2douyin.storage.query_indexes:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["news2douyin*"]

[tool.setuptools.package-data]
news2douyin = ["extraction/*.yaml", "collect/providers/*.json", "server/data/*.json", "server/data/*.txt", "server/templates/*.html", "server/static/*.js", "server/static/*.css", "server/static/vendor/*", "prompts/en/*.txt", "prompts/zh/*.txt", "export/templates/*.j2", "research/*.md", "intake/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
