<!doctype html>
<html>
<head><meta charset="utf-8"><title>{{event.headline}}</title>
<style>
body { font-family: system-ui, sans-serif; margin: 24px; }
pre { background: #f7f7f7; padding: 12px; border-radius: 10px; overflow-x: auto; }
.small { color: #666; font-size: 12px; }
audio { width: 100%; margin: 10px 0; }
</style></head>
<body>
<p class="small"><a href="/">Runs</a> · <a href="/dashboard">Dashboard</a></p>
<a href="/run/{{run.id}}">← back</a>
<h1>{{event.headline}}</h1>
<div class="small">{{run.run_key}} | {{run.created_at}}</div>

<h2>Audio</h2>
{% if event.audio_zh_path %}
<div><b>Chinese</b></div>
<audio controls src="{{event.audio_zh_path}}"></audio>
{% endif %}
{% if event.audio_en_path %}
<div><b>English</b></div>
<audio controls src="{{event.audio_en_path}}"></audio>
{% endif %}

<h2>Script (ZH)</h2>
<pre>{{event.script_zh}}</pre>

<h2>Script (EN)</h2>
<pre>{{event.script_en}}</pre>
</body></html>
