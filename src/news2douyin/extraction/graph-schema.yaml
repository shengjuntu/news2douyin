version: '2.0'
owner: "PostgreSQL (SQLite compatible): immutable evidence, topic definitions and editorial state; DuckDB: raw archive; FalkorDB: replayable graph projection and derived analysis"
projection: "FalkorDB required for graph ranking and focus propagation; replayable transactional outbox"
identity: "Referent.identity_status=curated uses curated aliases; name_candidate joins normalized typed names only and is not a verified real-world identity. No causal inference from co-occurrence."
shared_nodes:
  Referent: {id: string, name: string, entity_type: string, identity_status: string}
  OccurrenceCandidate: {id: string}
  Event: {id: string, title: string}
  Article: {id: string}
  EventMention: {id: string, revision: integer, field: string, start: integer, end: integer, quote: string, trigger: string, kind: string, status: string, raw_time: string, date: string, review: string, extractor: string}
  Argument: {id: string, role: string, text: string, entity_type: string, field: string, start: integer, end: integer, quote: string}
shared_relationships:
  REFERS_TO: {from: Argument, to: Referent, source: "curated alias or typed normalized name candidate; check identity_status"}
  HAS_MATCH_KEY: {from: EventMention, to: OccurrenceCandidate, source: action + status + day + roles + place}
  DESCRIBES: {from: Article, to: EventMention, cardinality: "1:N per graph", source: "one immutable source revision, unique original passage"}
  HAS_ARGUMENT: {from: EventMention, to: Argument, cardinality: "1:N per graph", source: "same-revision passage; may cite a second passage for coreference"}
global_nodes:
  SourceEvent: {key: "gdelt/<GlobalEventID>", event_date: string, event_code: string, feed: string, stamp: string, row_index: integer, projected_documents: integer, has_more_documents: boolean}
  GkgSubject: {key: string, name: string, kind: string}
  GdeltDocument: {key: string, identifier: string, gkg_record_id: string, gkg_feed: string, gkg_stamp: string, gkg_row: integer}
  GdeltActor: {key: string, name: string, country_code: string, iso2: string}
  GdeltPlace: {key: string, name: string, country_code: string, iso2: string, latitude: number, longitude: number}
  GraphMeta: {id: string, owner: string, schema: string}
  Entity: {id: string, optional_labels: [Person, Organization]}
  Place: {iso: string}
  Focus: {id: string, name: string, enabled: boolean}
global_extensions:
  Event: {seen: string, score: float, community: string, analysis_generation: string}
  Article: {title: string, domain: string, duplicate_root: string}
global_relationships:
  GKG_MENTIONS: {from: GdeltDocument, to: GkgSubject, meaning: "GKG document-level name; event roles require separate evidence"}
  MENTIONED_IN: {from: SourceEvent, to: GdeltDocument, attributes: [mention_key, first_seen, last_seen, first_feed, first_stamp, first_row, last_feed, last_stamp, last_row, confidence, sentence_id, actor1_offset, actor2_offset, action_offset], meaning: "Distinct source event/document pair; first and last archive rows preserve observation provenance"}
  CODED_ACTOR1: {from: SourceEvent, to: GdeltActor, meaning: "Actor1 from GDELT Events"}
  CODED_ACTOR2: {from: SourceEvent, to: GdeltActor, meaning: "Actor2 from GDELT Events"}
  CODED_ACTION_AT: {from: SourceEvent, to: GdeltPlace, meaning: "ActionGeo from GDELT Events"}
  RELATED_EVENT: {from: Event, to: Event, attributes: [weight, evidence, generation], meaning: "shared participant within 30 days or strict action-match candidate; not causality or event identity"}
  HAS_SOURCE: {from: Event, to: Article}
  MENTIONS: {from: Article, to: Entity}
  MENTIONS_PLACE: {from: Article, to: Place}
  ACTION_AT: {from: Event, to: Place, evidence: [article, revision, quote]}
  IMPACTS: {from: Event, to: Place, evidence: [article, revision, quote]}
  WATCHES: {from: Focus, to: Entity}
  TRACKS: {from: Focus, to: Event, attributes: [reason, branch, relevance]}
focus_nodes:
  Question: {id: string, text: string, scope: string}
  InterestScope: {id: string, description: string, version: integer, method: string, time_start: string, time_end: string, includes: string, excludes: string}
  InterestEntity: {id: string, name: string, entity_type: string, aliases: string, core: boolean, stamp: string}
  InterestPattern: {id: string, subject: string, relation: string, object: string, keywords: string, stamp: string}
  OutlinePoint: {id: string, text: string}
  Investigation: {id: string, case_id: string, status: string}
  ResearchQuestion: {id: string, text: string, status: string}
  Claim: {id: string, text: string, kind: string}
  EvidenceRef: {id: string, source: string, paragraph: string}
  Report: {id: string, title: string, version: integer}
focus_extensions:
  Article: {url: string}
focus_relationships:
  DEFINED_BY: {from: Question, to: InterestScope, meaning: "user interest definition; not a claim about an event"}
  HAS_ANCHOR: {from: InterestScope, to: InterestEntity}
  HAS_PATTERN: {from: InterestScope, to: InterestPattern, meaning: "relation to search for; never evidence that it happened"}
  PATTERN_SUBJECT: {from: InterestPattern, to: InterestEntity}
  PATTERN_OBJECT: {from: InterestPattern, to: InterestEntity}
  MAPS_TO: {from: InterestEntity, to: Referent, meaning: "curated or typed name candidate; inspect Referent.identity_status"}
  RELEVANT_MATERIAL: {from: OutlinePoint, to: Event, attributes: [reason], meaning: "relevance hint, not supporting evidence"}
  HAS_MATERIAL: {from: Question, to: Event, attributes: [reason]}
  CITES: {from: Event, to: Article}
  HAS_SUBQUESTION: {from: [Question, OutlinePoint], to: OutlinePoint, parents_per_child: 1}
  CHECKED_BY: {from: [Question, OutlinePoint], to: Investigation}
  ASKS: {from: Investigation, to: ResearchQuestion}
  FOUND: {from: Investigation, to: Claim}
  HAS_EVIDENCE: {from: Claim, to: EvidenceRef, attributes: [kind]}
  ANSWERED_BY: {from: ResearchQuestion, to: Claim}
  PRODUCED: {from: Investigation, to: Report}
primary_keys: {default: id, Place: iso}
units: {offset: "Unicode code points, half open", date: "ISO date or month; empty when unknown"}
