{% extends "base.html" %}
{% block title %}作品库 · news2douyin{% endblock %}
{% block content %}
<style>
[hidden]{display:none!important}.work-filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;margin-bottom:18px}.work-filters label{display:flex;flex-direction:column;gap:7px}.work-filters input,.work-filters select{width:100%}.works-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.work-card{background:#171b25;border:1px solid #30394c;border-radius:12px;overflow:hidden;min-width:0}.work-body{display:grid;grid-template-columns:110px minmax(0,1fr);gap:14px;padding:16px}.work-thumb{width:110px;height:196px;background:#0b111d;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#6f809d;border-radius:6px}.work-thumb img{width:100%;height:100%;object-fit:contain}.work-card h2{margin:4px 0 12px;font-size:16px;line-height:1.6;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.work-card p{font-size:12px;color:#9aa7bd;line-height:1.8;margin:8px 0}.work-links{border-top:1px solid #30394c;padding:12px 16px;display:flex;gap:14px;flex-wrap:wrap;font-size:12px}.work-filters .checks{display:flex;flex-direction:row;gap:16px;align-items:center}.checks label{display:block}.checks input{width:auto}.library-head{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}.empty-work{padding:42px;text-align:center;grid-column:1/-1}.work-card .star{padding:4px 8px;float:right}#work-error{color:#f6b452;white-space:pre-wrap}.pagination{margin-top:22px}@media(max-width:1100px){.works-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.works-grid,.work-filters{grid-template-columns:1fr}.work-body{grid-template-columns:100px minmax(0,1fr)}.work-thumb{width:100px;height:178px}}
</style>
<div class="library-head"><div><h1>作品库</h1><p class="muted">保留成片和每次制作记录，按标题、日期或状态查找。</p></div><div class="row"><a href="/scripts">从审核稿开始制作 →</a><button id="refresh-works" class="ghost" type="button">刷新</button></div></div>
<form id="work-filters" class="card work-filters"><label>标题或备注<input id="work-query" maxlength="300" placeholder="搜索作品"></label><label>制作状态<select id="work-status"><option value="succeeded">已完成</option><option value="all">全部记录</option><option value="active">制作中 / 排队中</option><option value="failed">失败</option><option value="cancelled">已取消</option></select></label><label>画面模板<select id="work-template"><option value="">全部模板</option><option value="brief">新闻简报</option><option value="explain">解释说明</option><option value="timeline">事件复盘</option><option value="legacy">旧版新闻卡</option></select></label><label>提交起始日期<input id="work-from" type="date"></label><label>提交结束日期<input id="work-to" type="date"></label><div><p class="small muted">日期按 {{ timezone }} 查询</p><div class="checks"><label><input id="work-starred" type="checkbox"> 只看收藏</label><label><input id="work-archived" type="checkbox"> 归档记录</label></div></div><div class="row"><button>筛选作品</button><button id="reset-works" type="button" class="ghost">清空条件</button></div></form>
<p id="work-error" role="status"></p><p id="work-count" class="muted"></p><div id="works" class="works-grid" aria-live="polite"></div><div class="row pagination"><button id="work-prev" class="ghost" type="button">上一页</button><span id="work-page" class="muted"></span><button id="work-next" class="ghost" type="button">下一页</button></div>
<script>
const el=id=>document.getElementById(id),esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const states={succeeded:'已完成',failed:'失败',queued:'排队中',running:'制作中',cancelled:'已取消',cancel_requested:'正在取消'};
let offset=0,pageData=null,requestNumber=0;
function params(){return new URLSearchParams({query:el('work-query').value,status:el('work-status').value,template:el('work-template').value,date_from:el('work-from').value,date_to:el('work-to').value,starred:el('work-starred').checked,archived:el('work-archived').checked,timezone:{{ timezone|tojson }},offset,limit:24});}
function date(value){try{return new Intl.DateTimeFormat('zh-CN',{timeZone:{{ timezone|tojson }},dateStyle:'medium',timeStyle:'short'}).format(new Date(value));}catch{return value;}}
async function load(){const n=++requestNumber;el('work-error').textContent='';try{const response=await fetch('/api/video/works?'+params());const data=await response.json();if(n!==requestNumber)return;if(!response.ok)throw Error(typeof data.detail==='string'?data.detail:JSON.stringify(data.detail));pageData=data;history.replaceState(null,'','/videos?'+params());el('work-count').textContent='共 '+data.total+' 条'+(el('work-archived').checked?'归档记录':'记录');el('work-page').textContent=data.total?'第 '+(Math.floor(offset/24)+1)+' / '+Math.ceil(data.total/24)+' 页':'0 页';el('work-prev').disabled=offset===0;el('work-next').disabled=offset+data.items.length>=data.total;el('works').innerHTML=data.items.map(v=>`<article class="work-card" data-task="${esc(v.task.task_id)}"><div class="work-body"><a class="work-thumb" href="/videos/${encodeURIComponent(v.task.task_id)}" aria-label="查看 ${esc(v.work.title)}">${v.cover_url?'<img loading="lazy" src="'+esc(v.cover_url)+'" alt="'+esc(v.work.title)+' 的封面">':'<span>'+esc(states[v.task.status]||v.task.status)+'</span>'}</a><div><button type="button" class="ghost star" data-star="${esc(v.task.task_id)}" aria-label="${v.work.starred?'取消收藏':'收藏'}">${v.work.starred?'★':'☆'}</button><h2><a href="/videos/${encodeURIComponent(v.task.task_id)}">${esc(v.work.title)}</a></h2><span class="badge ${v.task.status==='succeeded'?'ok':v.task.status==='failed'?'bad':''}">${esc(states[v.task.status]||v.task.status)}</span><p>${esc(v.template_name)} · 脚本 r${v.revision}</p><p>${v.duration?Number(v.duration).toFixed(1)+' 秒 · '+v.width+' × '+v.height:''}</p><p>${esc(date(v.task.created_at))}</p>${v.missing_files.length?'<p class="badge warn">部分文件缺失</p>':''}</div></div><div class="work-links"><a href="/videos/${encodeURIComponent(v.task.task_id)}">${v.task.status==='succeeded'?'预览与详情':'进度与恢复'}</a>${v.video_url?'<a href="'+esc(v.video_url)+'?download=true">MP4</a>':''}${v.subtitles_url?'<a href="'+esc(v.subtitles_url)+'?download=true">字幕</a>':''}${v.bundle_url?'<a href="'+esc(v.bundle_url)+'?download=true">制作包</a>':''}</div></article>`).join('')||'<div class="card empty-work"><h2>没有符合条件的作品</h2><p class="muted">可切换“全部记录”查看制作中或失败的任务，或从审核稿开始制作。</p><a href="/scripts">去脚本工作台 →</a></div>';document.querySelectorAll('[data-star]').forEach(button=>button.onclick=()=>star(button));document.querySelectorAll('.work-thumb img').forEach(img=>img.onerror=()=>{img.hidden=true;img.parentElement.append(document.createTextNode('封面暂不可用'));});}catch(e){if(n===requestNumber)el('work-error').textContent=e.message;}}
async function star(button){button.disabled=true;const item=pageData.items.find(v=>v.task.task_id===button.dataset.star),w=item.work;try{const r=await fetch('/api/video/works/'+item.task.task_id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({expected_version:w.version,title:w.title,notes:w.notes,starred:!w.starred,archived:w.archived})});const data=await r.json();if(!r.ok)throw Error(data.detail);await load();}catch(e){el('work-error').textContent=e.message;button.disabled=false;}}
el('work-filters').onsubmit=e=>{e.preventDefault();offset=0;load();};el('work-prev').onclick=()=>{offset=Math.max(0,offset-24);load();};el('work-next').onclick=()=>{offset+=24;load();};el('refresh-works').onclick=load;el('reset-works').onclick=()=>{el('work-filters').reset();offset=0;load();};
const initial=new URLSearchParams(location.search);for(const [id,key] of [['work-query','query'],['work-status','status'],['work-template','template'],['work-from','date_from'],['work-to','date_to']])if(initial.has(key))el(id).value=initial.get(key);el('work-starred').checked=initial.get('starred')==='true';el('work-archived').checked=initial.get('archived')==='true';offset=Math.max(0,Number(initial.get('offset'))||0);load();
</script>
{% endblock %}
