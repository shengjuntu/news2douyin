{% set seed=seed|default({}) %}
<link rel="stylesheet" href="/research-assets/causal.css?v=0.47.0">
<div class="causal-page">
  {% if not causal_focus_key %}<h1>查找前因</h1>{% endif %}
  <form id="causal-form" class="card causal-form" method="post" action="/api/causal/investigations">
    <label for="causal-text">事件描述</label>
    <textarea id="causal-text" name="text" rows="4" required maxlength="2000" placeholder="想查找哪件事的前因？">{{ seed.text|default('') }}</textarea>
    <input type="hidden" name="event_key" value="{{ seed.event_key|default('') }}">
    <div class="row" id="causal-root" {% if not (seed.event_key|default('')) %}hidden{% endif %}>
      <a id="causal-root-link" href="/events/{{ seed.event_key|default('')|urlencode }}" class="small">查看关联事件</a>
      <button id="causal-root-clear" class="ghost" type="button">改用自由描述</button>
    </div>
    <details class="causal-options">
      <summary>时间与查找方式</summary>
      <div class="row">
        <label for="causal-at">事件时间（可选）</label>
        <input id="causal-at" name="event_at" maxlength="48" value="{{ seed.event_at|default('') }}" placeholder="如 2026-11-19">
        <span class="muted small">日期或 ISO 时间，默认系统时区</span>
      </div>
      {% if causal_focus_key %}
      <div class="row">
        <label for="causal-runner">查找方式</label>
        <select id="causal-runner" name="runner">
          <option value="agent">RunDesk</option>
          <option value="local">本地查找</option>
        </select>
      </div>
      <div class="row" id="causal-date-options">
        <label for="causal-date-from">最早查找日期（可选）</label>
        <input id="causal-date-from" name="date_from" type="date">
      </div>
      {% endif %}
      <label id="causal-automatic" {% if causal_focus_key %}hidden{% endif %}><input name="automatic" type="checkbox"> 自动沿排名靠前的分支继续查找</label>
    </details>
    <button type="submit" id="causal-submit">{% if causal_focus_key %}用 RunDesk 查找{% else %}查找前因{% endif %}</button>
  </form>
  <p id="causal-message" class="causal-message" role="status"></p>
  <section id="causal-result" aria-labelledby="causal-result-title" hidden>
    <div class="row causal-result-head">
      <h2 id="causal-result-title" tabindex="-1">候选前因</h2>
      <span id="causal-progress" class="badge" role="status"></span>
    </div>
    <p id="causal-anchor" class="muted small" hidden></p>
    <p id="causal-coverage" class="muted small"></p>
    <div class="row causal-assistance">
      <a id="causal-archive" hidden>核对归档覆盖</a>
      <a id="causal-research" hidden>研究助手设置</a>
    </div>
    {% if causal_focus_key %}
    <section id="causal-agent" class="card causal-agent" aria-label="RunDesk 研究" hidden>
      <div class="row">
        <strong>RunDesk 研究</strong>
        <span id="causal-agent-status" class="badge" role="status" hidden></span>
        <span id="causal-agent-window" class="muted small" hidden></span>
        <a id="causal-agent-research" hidden>查看研究</a>
      </div>
      <form id="causal-agent-form" class="row" method="post">
        <label for="causal-agent-date-from">最早查找日期（可选）</label>
        <input id="causal-agent-date-from" name="date_from" type="date">
        <button id="causal-agent-submit" type="submit" class="ghost">交给 RunDesk</button>
      </form>
      <p id="causal-agent-error" class="causal-message" data-error="true" hidden></p>
      <p id="causal-agent-message" class="causal-message" role="status"></p>
    </section>
    {% endif %}
    <details class="card causal-repair">
      <summary>补采 GDELT 归档</summary>
      <form id="causal-repair-form" class="row" method="post">
        <label>日期（北京时间） <input type="date" name="day" required></label>
        <button id="causal-repair-submit" type="submit" class="ghost">提交补采</button>
        <button id="causal-repair-refresh" type="button" class="ghost" hidden>刷新补采状态</button>
      </form>
      <p id="causal-repair-message" class="causal-message" role="status"></p>
      <ul id="causal-repair-list" hidden></ul>
    </details>
    <div id="causal-tree"></div>
  </section>
  <details class="card causal-history" id="causal-history">
    <summary>查找记录</summary>
    <div id="causal-history-list"></div>
  </details>
</div>
<script type="application/json" id="causal-config">{{ {'task_key': task_key|default(''), 'page_root': causal_page_root|default('/radar/causes'),
    'focus_key': causal_focus_key|default('')}|tojson }}</script>
<script src="/research-assets/causal.js?v=0.47.0" defer></script>
