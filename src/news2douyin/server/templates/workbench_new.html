{% extends 'base.html' %}{% block title %}形成选题 · news2douyin{% endblock %}{% block content %}
<a href="/workbench">← 内容工作台</a><h1>新建选题</h1>
<form id="work-new" class="card desk-form"><label>选题标题<input name="title" maxlength="250" value="{{ title }}" required></label>
<label>讲述角度或核心问题<textarea name="angle" rows="3" maxlength="1500"></textarea></label>
{% if watch %}<p>来自焦点 {{ watch_name }}</p><div class="row"><label>材料起始日期<input type="date" name="date_from"></label><label>材料结束日期<input type="date" name="date_to"></label></div>{% endif %}
{% if digest_day %}<p class="muted"><a href="/radar?day={{ digest_day }}">来源 {{ digest_day }} 日报</a></p>{% endif %}
<button>创建并进入选题</button><p id="new-message" role="status" class="desk-error"></p></form>
<script>
(() => {
  const form = document.querySelector('#work-new');
  const digest = {{ (dict(digest_day=digest_day,progress=progress,digest_token=digest_token) if digest_day else {})|tojson }};
  const storageKey = ['n2d-new-content-request', ...Object.values(digest)].join('/');
  let requestId = sessionStorage.getItem(storageKey);
  if (!requestId) {
    const nonce = crypto.getRandomValues(new Uint8Array(16));
    requestId = Array.from(nonce, n => n.toString(16).padStart(2, '0')).join('');
    sessionStorage.setItem(storageKey, requestId);
  }

  form.addEventListener('submit', async event => {
    event.preventDefault();
    const button = form.querySelector('button');
    button.disabled = true;
    try {
      const payload = {
        ...digest, ...Object.fromEntries(new FormData(form)), request_id: requestId,
        event: {{ event|tojson }}, watch: {{ watch|tojson }}, articles: {{ ([article] if article else [])|tojson }}
      };
      const response = await fetch('/api/workbench', {
        method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)
      });
      const result = await response.json();
      if (!response.ok) throw new Error(typeof result.detail === 'string' ? result.detail : JSON.stringify(result.detail));
      sessionStorage.removeItem(storageKey);
      location.href = '/workbench/' + result.key + '/selection';
    } catch (error) {
      document.querySelector('#new-message').textContent = error.message;
      button.disabled = false;
    }
  });
})();
</script>{% endblock %}
