{% extends "base.html" %}
{% block title %}视频结果 · news2douyin{% endblock %}
{% block content %}
<h1>{{ video.title }}</h1><p class="muted">脚本 r{{ video.revision }} · {{ video.task.task_id }}</p>
<div class="row"><a href="/tasks/{{ video.task.task_id }}">任务进度与日志</a><a href="/scripts/{{ video.package_key }}/video">再制作一版</a><a href="/videos">视频列表</a></div>
<p id="status" aria-live="polite"></p><p id="error" role="alert" style="white-space:pre-wrap"></p>
<progress id="progress" style="width:100%"></progress>
<p><button id="cancel" type="button" class="ghost">取消任务</button> <button id="retry" type="button" class="ghost">重试</button></p>
<div id="result" hidden><video id="player" controls preload="metadata" style="width:min(100%,420px);max-height:75vh;background:#000"></video><p id="specs" class="muted"></p><div id="downloads" class="row"></div></div>
<p class="muted small">自动配音字幕依据分段音频时长，不是逐字强制对齐。请预览并检查发音、素材和字幕后再使用成片。</p>
<script>
const taskId={{ video.task.task_id | tojson }};
const el=id=>document.getElementById(id);
const states={queued:'排队中',running:'制作中',cancel_requested:'正在取消',cancelled:'已取消',failed:'失败',succeeded:'已完成'};
const stages={queued:'等待执行',starting:'开始',preparing:'准备视频',voice:'合成配音',subtitles:'生成字幕',frames:'绘制画面',rendering:'编码视频',verifying:'校验成片',packaging:'整理产物',complete:'完成'};
let timer=null,loaded=false;
async function refresh(){clearTimeout(timer);try{const response=await fetch('/api/video/tasks/'+taskId);const data=await response.json();if(!response.ok)throw new Error(data.detail);const t=data.task;el('status').textContent=(states[t.status]||t.status)+' · '+(stages[t.stage]||t.stage)+' · 尝试 '+t.attempts+' 次';el('error').textContent=t.error_text||'';el('progress').max=Math.max(1,t.progress_total);if(t.status==='succeeded'){el('progress').max=1;el('progress').value=1;}else if(t.progress_total)el('progress').value=t.progress_current;else if(['failed','cancelled'].includes(t.status))el('progress').value=0;else el('progress').removeAttribute('value');el('cancel').disabled=!['queued','running'].includes(t.status);el('retry').disabled=!['failed','cancelled'].includes(t.status);if(t.status==='succeeded'&&!loaded){loaded=true;el('result').hidden=false;el('specs').textContent=data.result.width+' × '+data.result.height+' · '+data.result.fps+' fps · '+data.result.duration.toFixed(2)+' 秒';el('downloads').replaceChildren();for(const f of data.files){if(f.name==='video.mp4')el('player').src=f.url;if(f.name==='cover.png')el('player').poster=f.url;const link=document.createElement('a');link.href=f.url+'?download=true';link.textContent=f.name;el('downloads').append(link);}}if(!['succeeded','failed','cancelled'].includes(t.status))timer=setTimeout(refresh,1000);}catch(e){el('error').textContent=e.message;timer=setTimeout(refresh,3000);}}
async function action(name){el(name).disabled=true;try{const response=await fetch('/api/tasks/'+taskId+'/'+name,{method:'POST'});const data=await response.json();if(!response.ok)throw new Error(data.detail);await refresh();}catch(e){el('error').textContent=e.message;el(name).disabled=false;}}
el('cancel').onclick=()=>action('cancel');el('retry').onclick=()=>action('retry');refresh();
</script>
{% endblock %}
