<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}news2douyin v7{% endblock %}</title>
<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #0f1115; color: #e6e8ee; font-size: 14px; }
a { color: #4dd0e1; text-decoration: none; } a:hover { text-decoration: underline; }
header { display: flex; align-items: center; gap: 18px; padding: 10px 20px; background: #161922; border-bottom: 1px solid #262b38; position: sticky; top: 0; z-index: 5; }
header .logo { font-weight: 700; font-size: 16px; color: #fff; }
header .logo .dot { color: #fe2c55; }
nav { display: flex; gap: 4px; flex: 1; flex-wrap:wrap; }
nav a { padding: 6px 12px; border-radius: 6px; color: #aab2c5; }
nav a:hover { background: #222836; text-decoration: none; }
nav a.on { background: #2a3145; color: #fff; }
main { max-width: 1200px; margin: 0 auto; padding: 18px 20px 60px; }
h1 { font-size: 20px; margin: 6px 0 14px; } h2 { font-size: 16px; margin: 22px 0 10px; color: #cfd6e6; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.card { background: #161922; border: 1px solid #262b38; border-radius: 10px; padding: 14px 16px; }
.card .num { font-size: 26px; font-weight: 700; }
table { width: 100%; border-collapse: collapse; background: #161922; border: 1px solid #262b38; border-radius: 10px; overflow: hidden; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #222836; vertical-align: top; }
th { background: #1b2029; color: #9aa3b8; font-weight: 600; font-size: 12.5px; white-space: nowrap; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #1a1f2a; }
.badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; background: #2a3145; color: #cfd6e6; white-space: nowrap; }
.badge.ok { background: #123524; color: #4ade80; }
.badge.bad { background: #3b1520; color: #f87171; }
.badge.warn { background: #3a2e12; color: #fbbf24; }
.badge.cat { background: #14303a; color: #4dd0e1; }
.badge.pos { background: #123524; color: #4ade80; }
.badge.neg { background: #3b1520; color: #f87171; }
.muted { color: #7c8598; } .small { font-size: 12px; }
form.inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
input, select, textarea { background: #0f1115; color: #e6e8ee; border: 1px solid #2c3342; border-radius: 6px; padding: 7px 10px; font-size: 13.5px; }
input:focus, select:focus { outline: none; border-color: #fe2c55; }
button { background: #fe2c55; border: none; color: #fff; padding: 8px 16px; border-radius: 6px; font-size: 13.5px; cursor: pointer; }
button:hover { background: #e91e47; }
button.ghost { background: #222836; color: #cfd6e6; } button.ghost:hover { background: #2a3145; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.snippet { color: #9aa3b8; font-size: 12.5px; max-width: 420px; }
pre { background: #0b0d11; border: 1px solid #262b38; border-radius: 8px; padding: 10px; overflow: auto; font-size: 12px; }
footer { text-align: center; color: #5b647a; font-size: 12px; padding: 16px; }
button:disabled { opacity:.45; cursor:not-allowed; }
@media(max-width:800px){header{position:static;flex-wrap:wrap}main{padding:16px 12px}table{display:block;overflow-x:auto}}
</style>
</head>
<body>
<header>
  <div class="logo">news2douyin<span class="dot">·</span>0.10.1</div>
  <nav>
    <a href="/" class="{{ 'on' if active=='daily' }}">每日选题</a>
    <a href="/articles" class="{{ 'on' if active=='articles' }}">新闻库</a>
    <a href="/events" class="{{ 'on' if active=='events' }}">事件专题</a>
    <a href="/scripts" class="{{ 'on' if active=='scripts' }}">脚本工作台</a>
    <a href="/videos" class="{{ 'on' if active=='videos' }}">作品库</a>
    <a href="/profiles" class="{{ 'on' if active=='profiles' }}">采集策略</a>
    <a href="/admin" class="{{ 'on' if active in ['home','tasks','runs','timeline'] }}">运行管理</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>news2douyin 0.10.1 · <a href="/tasks">后台任务</a> · <a href="/runs">运行记录</a> · <a href="/timeline">新闻长图排版</a> · <a href="/docs">API</a></footer>
</body>
</html>
